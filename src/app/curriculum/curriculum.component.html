<div class="container mx-auto p-4 flex justify-center">
  @if(curriculum$ | async; as curriculum) {
    <div class="w-100" [innerHTML]="curriculum | markdown"></div>
  } @else {
      @if(loading()) {
        <div>Loading...</div>
      } @else {
        <div>Curriculum not available in this language</div>
      }
  }
</div>
